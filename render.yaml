services:
  - type: web
    name: snackztin-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STORE_URL
        value: https://snackztin.web.app
      - key: APP_URL
        value: https://snackztin.web.app
      - key: WHATSAPP_NUMBER
        value: 918078864233
      - key: JWT_SECRET
        generateValue: true
